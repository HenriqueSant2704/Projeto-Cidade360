<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Aplica o tema (claro ou escuro) antes da página aparecer.-->
    <script src="/FrontEnd/pages/global/tema.js?v=1"></script>

    <link rel="stylesheet" href="/FrontEnd/pages/global/global.css?v=10">
    <link rel="stylesheet" href="/FrontEnd/pages/avisos/avisos.css?v=4">

    <title>Cidade360-Avisos</title>
</head>

<body>
    <div class="container-sistema">

        <nav class="menu-lateral" aria-label="Menu principal">

            <a class="logo" href="/" aria-label="Cidade360, ir para o painel">
                <img src="/assets/img/global/logo/icone-cidade360.png" alt="">
                <span>Cidade<b>360</b></span>
            </a>

            <div class="menu-corpo">

                <div class="menu-secao">Principal</div>

                <ul class="menu-lista">
                    <li class="menu-item">
                        <a href="/" title="Painel">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
                            <span>Painel</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="/FrontEnd/pages/ocorrencia/ocorrencia.html" title="Ocorrências">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.3 3.9-8.2 14a2 2 0 0 0 1.7 3h16.4a2 2 0 0 0 1.7-3l-8.2-14a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
                            <span>Ocorrências</span>
                        </a>
                    </li>
                </ul>

                <div class="menu-secao">Comunicação</div>

                <ul class="menu-lista">
                    <li class="menu-item">
                        <a class="item-breve" role="link" aria-disabled="true" title="Campanhas (em breve)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>
                            <span>Campanhas</span>
                            <small class="tag-breve">Em breve</small>
                        </a>
                    </li>
                    <li class="menu-item" id="menu-ativo">
                        <a href="/FrontEnd/pages/avisos/avisos.html" title="Avisos" aria-current="page">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
                            <span>Avisos</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a class="item-breve" role="link" aria-disabled="true" title="Eventos (em breve)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
                            <span>Eventos</span>
                            <small class="tag-breve">Em breve</small>
                        </a>
                    </li>
                </ul>

            </div>

        </nav>


        <div class="container-conteudo">

            <header class="menu-topo">

                <div class="titulo-pagina">

                    <button class="minimizar-menu btn-icone" id="btnMinimizarMenuPainel" type="button" aria-label="Abrir menu">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>

                    <h1>Avisos</h1>

                </div>


                <div class="opcoes-menu-topo">

                    <div class="menu-acoes">
                        <button class="btn-icone" id="btnConfiguracoesPainel" type="button" aria-label="Configurações">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>

                    <div class="menu-acoes">
                        <button class="btn-icone" id="btnNotificacoesPainel" type="button" aria-label="Notificações">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                        </button>
                    </div>

                    <div class="perfil-usuario" id="perfilUsuarioPainel">

                        <div class="usuario">
                            <span>Usuário</span>
                            <p>Usuário</p>
                        </div>

                        <div class="foto-usuario" aria-hidden="true"></div>

                    </div>

                </div>

            </header>


            <!-- =====================================================
                 AVISOS
                 O conteúdo do feed e da lateral é montado pelo avisos.js.
            ====================================================== -->

            <main class="pagina-avisos" id="paginaAvisos">

                <section class="caixa-titulo">
                    <div class="textos">
                        <h2 id="tituloAvisos">Avisos da Prefeitura</h2>
                        <p id="subtituloAvisos">Eventos, inaugurações, obras e serviços da cidade em um só lugar. Reaja aos avisos para mostrar à prefeitura o que você achou.</p>
                    </div>

                    <!-- Botão "Novo aviso": aparece só para administradores -->
                    <div id="acaoTopoAvisos"></div>
                </section>

                <div id="avisoModoDemo" hidden></div>

                <div class="barra-filtros">
                    <div class="filtros" id="filtrosAvisos" role="toolbar" aria-label="Filtrar por categoria"></div>

                    <label class="busca">
                        <span class="sr">Buscar avisos</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                        <input id="buscaAvisos" type="search" placeholder="Buscar avisos" autocomplete="off">
                    </label>
                </div>

                <div class="grade">
                    <section class="feed" id="feedAvisos" aria-live="polite">
                        <div class="esqueleto"></div>
                        <div class="esqueleto"></div>
                    </section>

                    <aside class="lateral" id="lateralAvisos"></aside>
                </div>

            </main>

        </div>

    </div>


    <!-- Painel de criação, diálogos, imagem ampliada e toasts -->
    <div class="av-camadas" id="avisosCamadas">
        <div class="toasts" id="toastsAvisos" aria-live="polite"></div>
    </div>


    <!--Script para controlar o Login do usuário, e redirecionar para a página de login caso não esteja logado.-->
    <script src="/FrontEnd/pages/global/authGuard.js"></script>

    <!--Script para realizar o logout do usuário.-->
    <script src="/FrontEnd/pages/global/logout.js"></script>

    <script src="/FrontEnd/pages/global/global.js?v=11"></script>

    <!--PROVISÓRIO: dados de exemplo usados só enquanto o banco não tiver as tabelas de avisos.-->
    <script src="/FrontEnd/pages/avisos/avisosDemo.js?v=1"></script>

    <!--Script responsável pela página de avisos.-->
    <script src="/FrontEnd/pages/avisos/avisos.js?v=3"></script>

</body>

</html>
